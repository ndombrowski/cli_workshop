<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E07B00"/>
    </marker>
  </defs>
  <rect width="900" height="550" fill="white"/>
  <g stroke="#555" stroke-width="1.5">
    <line x1="450" y1="50" x2="100" y2="90"/>
    <line x1="450" y1="50" x2="230" y2="90"/>
    <line x1="450" y1="50" x2="360" y2="90"/>
    <line x1="450" y1="50" x2="650" y2="90"/>
    <line x1="360" y1="130" x2="360" y2="170"/>
    <line x1="360" y1="210" x2="360" y2="250"/>
    <line x1="650" y1="130" x2="650" y2="170"/>
    <line x1="650" y1="210" x2="650" y2="250"/>
    <line x1="650" y1="290" x2="650" y2="330"/>
    <line x1="650" y1="370" x2="650" y2="410"/>
    <line x1="650" y1="450" x2="485" y2="490"/>
    <line x1="650" y1="450" x2="595" y2="490"/>
    <line x1="650" y1="450" x2="705" y2="490"/>
    <line x1="650" y1="450" x2="815" y2="490"/>
  </g>
  <g stroke-width="1.5">
    <!-- the path you see: /home/username/personal (blue) -->
    <rect x="415" y="10"  width="70"  height="40" rx="6" fill="#DDF3FB" stroke="#31BAE9"/>
    <rect x="305" y="90"  width="110" height="40" rx="6" fill="#DDF3FB" stroke="#31BAE9"/>
    <rect x="295" y="170" width="130" height="40" rx="6" fill="#DDF3FB" stroke="#31BAE9"/>
    <!-- the link: dashed orange -->
    <rect x="295" y="250" width="130" height="40" rx="6" fill="#FFF1E0" stroke="#E07B00" stroke-dasharray="6,4"/>
    <!-- where the data really is: /zfs/omics/personal/username (blue) -->
    <rect x="595" y="90"  width="110" height="40" rx="6" fill="#DDF3FB" stroke="#31BAE9"/>
    <rect x="595" y="170" width="110" height="40" rx="6" fill="#DDF3FB" stroke="#31BAE9"/>
    <rect x="585" y="250" width="130" height="40" rx="6" fill="#DDF3FB" stroke="#31BAE9"/>
    <rect x="585" y="330" width="130" height="40" rx="6" fill="#DDF3FB" stroke="#31BAE9"/>
    <rect x="570" y="410" width="160" height="40" rx="6" fill="#DDF3FB" stroke="#31BAE9"/>
    <!-- other folders: white -->
    <rect x="45"  y="90"  width="110" height="40" rx="6" fill="white" stroke="#888"/>
    <rect x="175" y="90"  width="110" height="40" rx="6" fill="white" stroke="#888"/>
    <rect x="435" y="490" width="100" height="40" rx="6" fill="white" stroke="#888"/>
    <rect x="545" y="490" width="100" height="40" rx="6" fill="white" stroke="#888"/>
    <rect x="655" y="490" width="100" height="40" rx="6" fill="white" stroke="#888"/>
    <rect x="765" y="490" width="100" height="40" rx="6" fill="white" stroke="#888"/>
  </g>
  <!-- the link arrow -->
  <path d="M425,270 C510,270 500,350 583,350" fill="none" stroke="#E07B00" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="470" y="330" fill="#E07B00" font-size="15" text-anchor="middle">link</text>
  <g text-anchor="middle" dominant-baseline="central" fill="#222">
    <text x="450" y="30">/</text>
    <text x="100" y="110">bin</text>
    <text x="230" y="110">tmp</text>
    <text x="360" y="110">home</text>
    <text x="650" y="110">zfs</text>
    <text x="360" y="190">username</text>
    <text x="360" y="270">personal</text>
    <text x="650" y="190">omics</text>
    <text x="650" y="270">personal</text>
    <text x="650" y="350">username</text>
    <text x="650" y="430">data_analysis</text>
    <text x="485" y="510">data</text>
    <text x="595" y="510">results</text>
    <text x="705" y="510">scripts</text>
    <text x="815" y="510">logs</text>
  </g>
</svg>
